<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0F1512">
    <meta name="description" content="Atlas, a quiet student planner for the path ahead.">
    <meta name="application-version" content="0.4.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Atlas</title>
    <script>
      try {
        const savedPersonalization = JSON.parse(localStorage.getItem('atlas.personalization') || '{}');
        const activeId = savedPersonalization.activeThemeId || `atlas-${localStorage.getItem('atlas.theme') === 'light' ? 'light' : 'dark'}`;
        const selectedTheme = (savedPersonalization.savedThemes || []).find((theme) => theme.id === activeId);
        const mode = selectedTheme?.mode === 'light' || activeId === 'atlas-light' ? 'light' : 'dark';
        const colors = selectedTheme?.colors || {};
        document.documentElement.dataset.theme = mode;
        if (/^#[0-9a-f]{6}$/i.test(colors.accent || '')) document.documentElement.style.setProperty('--primary', colors.accent);
        if (/^#[0-9a-f]{6}$/i.test(colors.highlight || '')) {
          document.documentElement.style.setProperty('--primary-light', colors.highlight);
          document.documentElement.style.setProperty('--display-text', colors.highlight);
        }
        if (/^#[0-9a-f]{6}$/i.test(colors.background || '')) {
          document.documentElement.style.setProperty('--bg', colors.background);
          document.documentElement.style.setProperty('--surface', `color-mix(in srgb, ${colors.background} 92%, ${colors.highlight || '#a9c8b3'})`);
        }
        const transition1 = colors.transition1 || colors.accent;
        const transition2 = colors.transition2 || colors.highlight;
        const transition3 = colors.transition3 || colors.transition;
        if (/^#[0-9a-f]{6}$/i.test(transition1 || '')) document.documentElement.style.setProperty('--transition-primary', transition1);
        if (/^#[0-9a-f]{6}$/i.test(transition2 || '')) document.documentElement.style.setProperty('--transition-secondary', transition2);
        if (/^#[0-9a-f]{6}$/i.test(transition3 || '')) {
          document.documentElement.style.setProperty('--atmosphere-line', transition3);
          document.documentElement.style.setProperty('--transition-tertiary', transition3);
        }
        document.documentElement.dataset.focusMode = String(Boolean(savedPersonalization.focusMode));
      } catch { /* Atlas will restore safe defaults after startup. */ }
    </script>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icons/atlas-192.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/icons/atlas-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
  </head>
  <body>
    <noscript>Atlas needs JavaScript enabled to read your schedule.</noscript>
    <div id="app"></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
